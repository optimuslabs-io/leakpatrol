#
# Every code merge to main is a release: this workflow reads the latest vX.Y.Z tag,
# bumps the patch number, and -- only if `make check` passes on the new commit --
# tags, builds, and publishes it. Nobody picks a version number by hand; a commit
# that fails check never consumes one. Docs-only merges do not release.
#
# workflow_dispatch exists for the cases where a push does not fire this workflow
# (GitHub skips path-filtered runs it cannot diff, such as a rewritten root commit)
# and for cutting the first release of a fresh repository. It goes through the same
# `release` environment gate as a push, so a human still approves every publish.
#
# Trust properties, in decreasing order of strength:
#   1. Sigstore provenance (attest-build-provenance): cryptographic proof, in a
#      public transparency log, that each binary was built by this workflow from
#      this commit. Verify with:
#        gh attestation verify <binary> -R optimuslabs-io/leakpatrol
#   2. Reproducibility: -trimpath, -buildvcs=false, SOURCE_DATE_EPOCH pinned to
#      the commit time -- anyone can rebuild the tag and diff.
#   3. SHA256SUMS: integrity of the download, not authenticity.
name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - 'demo.tape'
      - 'docs/**'
      - 'rules/**'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A human gate on the one step that can hand operators a signed binary. The
    # `release` environment must be configured in the repository settings with
    # required reviewers; the job then pauses until a maintainer approves it. Without
    # that, a compromised maintainer token or a merged malicious PR would publish an
    # attested release automatically -- the attack class this tool exists to detect.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Compute next version
        id: version
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "latest=$latest next=$next" >&2
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - run: make check

      - name: Tag ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) make release

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/leakpatrol_*

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/leakpatrol_* dist/SHA256SUMS \
            --verify-tag \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
