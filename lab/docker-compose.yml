# leakpatrol lab -- a contained reconstruction of the Coder registry hijack.
# Copyright 2026 Optimus Labs (Civilizations research team). Apache-2.0.
#
# READ lab/README.md BEFORE RUNNING. This stands up a deliberately hijacked
# registry and an exfil sink. Containment is the whole design:
#
#   * The network is `internal: true` -- Docker installs no NAT and no gateway,
#     so nothing here can reach the internet even if a template tried. The
#     "exfil" cannot leave this machine.
#   * registry.coder.com and www.coder-infra.com are compose DNS ALIASES on the
#     rogue container. Your host's /etc/hosts and DNS are never touched, so
#     nothing outside this compose project resolves them differently.
#   * No ports are published. Nothing on your LAN can reach the lab. The
#     assertions run from the `responder` container ON the lab network, which is
#     also the honest demonstration: this is how you scan a real provisioner pod.
#   * The Docker socket is never mounted. Nothing here talks to the daemon.
#   * Images are pinned by digest, so a re-run cannot silently get other bytes.
#   * Every container drops all capabilities and forbids privilege escalation.
#
# The one moment this lab needs the internet is `lab/providers.sh` (run by `make lab-up`), which
# populates lab/mirror/ with the Terraform providers. That runs on a SEPARATE,
# non-internal network, before the lab comes up, and is a separate step for
# exactly that reason.

name: leakpatrol-lab

networks:
  lab:
    # No egress. This is the control that makes running an exfil simulation safe.
    internal: true

volumes:
  pgdata:
  coderdata:
  roguelogs:

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    <<: *hardening
    # Postgres needs these two to drop from root to the postgres user itself.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The attacker's infrastructure, faithfully collapsed into one host: in the
  # real incident the same rogue address both served the tampered registry and
  # received the exfiltrated credentials.
  rogue:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    <<: *hardening
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - ./rogue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - ./out/registry:/srv/registry:ro
      - roguelogs:/var/log/nginx
    networks:
      lab:
        aliases:
          # The hijack, contained: these names resolve to this container and
          # nowhere else, and only for containers on this compose network.
          - registry.coder.com
          - www.coder-infra.com
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  coder:
    image: ghcr.io/coder/coder:v2.36.3@sha256:e71d75fac8743c1295ab5394a3ec05aeb9849c997fd670c914c27334bb8a7761
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
      rogue:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:coder@postgres:5432/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:3000
      CODER_ACCESS_URL: http://coder:3000
      CODER_TELEMETRY_ENABLE: "false"
      CODER_UPDATE_CHECK: "false"
      # Terraform is Go, so this is enough to make it trust the lab CA without
      # touching the image's trust store or running anything as root.
      SSL_CERT_FILE: /lab/tls/ca.pem
      # Providers come from the offline mirror populated by `lab/providers.sh`;
      # nothing reaches registry.terraform.io (it could not, on an internal network).
      TF_CLI_CONFIG_FILE: /lab/terraformrc
    volumes:
      - coderdata:/home/coder/.config
      - ./tls:/lab/tls:ro
      - ./terraformrc:/lab/terraformrc:ro
      - ./mirror:/lab/mirror:ro
      - ./out/template:/lab/template:ro
      # The leakpatrol binary, mounted the way an operator would kubectl cp it
      # into a provisioner pod.
      - ./out/bin:/lab/bin:ro
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v2/buildinfo >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Where the assertions run. postgres:16-alpine because it ships psql, which is
  # what leakpatrol's db tier shells out to -- no third-party driver, same as
  # in production.
  responder:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    <<: *hardening
    depends_on:
      coder:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:coder@postgres:5432/coder?sslmode=disable
    volumes:
      - ./out/bin:/lab/bin:ro
      - ./out:/lab/out
      - roguelogs:/lab/roguelogs:ro
    networks: [lab]
    # Idle until run.sh execs the assertions into it.
    command: ["sleep", "infinity"]
