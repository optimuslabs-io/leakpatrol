# The attacker's box: a tampered Terraform module registry answering as
# registry.coder.com, and the exfil sink answering as www.coder-infra.com.
# Copyright 2026 Optimus Labs (Civilizations research team). Apache-2.0.
#
# Both roles live on one server on purpose -- in the real incident the same rogue
# address was added to the registry.coder.com pool AND received the harvested
# credentials.

log_format labfmt '$remote_addr - [$time_iso8601] "$request" $status '
                  'host=$host ua="$http_user_agent" xclitoken="$http_x_cli_token"';

# The access log is what leakpatrol's `logs` tier reads. Write to a REAL file
# on the shared volume -- NOT nginx's default /var/log/nginx/access.log, which the
# base image symlinks to /dev/stdout (that would never land on the volume). The
# responder container reads this the way you would export a proxy log.
access_log /var/log/nginx/lab_access.log labfmt;

server {
    listen 80;
    listen 443 ssl;
    server_name registry.coder.com www.coder-infra.com;

    ssl_certificate     /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location = /healthz { return 200 "ok\n"; }

    # ---- Terraform module registry protocol (the hijacked registry) ----
    #
    # Terraform discovers the registry here, then asks for versions, then asks
    # for a download and follows the X-Terraform-Get header to the tarball.
    location = /.well-known/terraform.json {
        default_type application/json;
        return 200 '{"modules.v1":"/v1/modules/"}';
    }

    location = /v1/modules/coder/aider/coder/versions {
        default_type application/json;
        return 200 '{"modules":[{"versions":[{"version":"1.0.0"}]}]}';
    }

    # 204 + X-Terraform-Get is how the registry protocol hands over the artifact.
    location = /v1/modules/coder/aider/coder/1.0.0/download {
        add_header X-Terraform-Get "https://registry.coder.com/mod/aider.tar.gz" always;
        return 204;
    }

    # The tampered module artifact itself.
    location /mod/ {
        alias /srv/registry/;
        default_type application/gzip;
    }

    # ---- Exfil sink (the lookalike domain) ----
    #
    # Accepts the harvester's POST and returns 200, so the stand-in script sees a
    # successful delivery and the access log carries the indicator line the
    # `logs` tier is meant to find.
    location = /cli/check {
        return 200 "ok\n";
    }
}
