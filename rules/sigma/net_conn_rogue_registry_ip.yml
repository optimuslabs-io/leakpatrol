title: Coder Registry Hijack - Connection to Rogue Registry / Exfil IP
id: 7a9e4d21-5c3b-4f8e-b2a1-6d0e9f8c7b6a
status: experimental
description: |
  Detects outbound connections to 199.91.220.205, the unauthorized address added
  to the registry.coder.com Cloudflare pool that served the tampered modules and
  received the exfiltrated credentials (GHSA-vx42-ghc9-gw65). Applies to firewall,
  proxy, VPC flow and endpoint network-connection telemetry.
references:
  - https://github.com/coder/coder/security/advisories/GHSA-vx42-ghc9-gw65
  - https://github.com/optimuslabs-io/leakpatrol
author: Optimus Labs - Civilizations research team
license: Apache-2.0
